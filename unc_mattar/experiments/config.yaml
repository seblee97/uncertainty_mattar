seed: 0
gpu_id: 0 # None for CPU

runner: "evb" 

experiment:
    num_episodes: 500

    map_path: "../maps/maze.txt"
    map_yaml_path: "../maps/maze.yaml"
    test_map_yaml_path: "../maps/test_maze.yaml"
    
    train_episode_timeout: 1000
    test_episode_timeout: 1000

logging:
    checkpoint_frequency: 25
    visualisation_frequency: 25
    stdout_frequency: 1000

learning:
    learning_rate: 0.1
    transition_learning_rate: 0.9
    planning_learning_rate: 0.1
    beta: 5.0
    gamma: 0.9
    e_lambda: 1.0 # eligibility trace parameter
    pre_episode_planning_steps: 20
    post_episode_planning_steps: 20
    k_additional_planning_steps: 2
    top_k: 5
    max_chain: 20

    buffer: model # model or per 

    per_buffer:
        max_buffer_size: 10000

    initialisation_strategy: "zeros" # "zeros" or "random"

    random_initialisation:
        mean: 0.0
        variance: 0.1
